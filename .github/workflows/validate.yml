name: Validate ALI FITNESS PRO
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, redesign/ali-fitness-pro]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ali_fitness_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ali_fitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ali_fitness_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check classic UI script syntax
        run: node --check assets/app-ui.js
      - name: Check ES module syntax
        run: node --input-type=module --check < assets/app-data.js
      - name: Run application smoke tests
        run: node tests/smoke.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated database schema for migration test
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (id uuid primary key);
          create table public.ai_coach_requests (
            id uuid primary key default gen_random_uuid(),
            user_id uuid not null references auth.users(id),
            requested_at timestamptz not null default now()
          );
          SQL
      - name: Apply atomic rate-limit migration
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261120154250_atomic_ai_coach_daily_limit.sql
      - name: Test concurrent per-user AI request limit
        run: bash tests/atomic-ai-rate-limit.sh
